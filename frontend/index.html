<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Job Tracker</h1>

    <!-- Stats -->
    <section class="stats">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-waiting">0</span>
        <span class="stat-label">Waiting</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-rejected">0</span>
        <span class="stat-label">Rejected</span>
      </div>
    </section>

    <!-- Add form -->
    <section class="card">
      <h2>Add application</h2>
      <form id="add-form">
        <div class="form-grid">
          <label>
            Company
            <input type="text" name="company" required maxlength="200" placeholder="e.g. Google">
          </label>
          <label>
            Role
            <input type="text" name="role" required maxlength="200" placeholder="e.g. Backend Engineer">
          </label>
          <label>
            Status
            <select name="status">
              <option value="Applied">Applied</option>
              <option value="Interviewing">Interviewing</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
            </select>
          </label>
          <label>
            Date applied
            <input type="date" name="date_applied" required>
          </label>
        </div>
        <div class="form-footer">
          <button type="submit">Add</button>
          <span id="form-message" class="message" role="status"></span>
        </div>
      </form>
    </section>

    <!-- Table -->
    <section class="card">
      <div class="table-header">
        <h2>Applications</h2>
        <label class="filter">
          Status
          <select id="status-filter">
            <option value="">All</option>
            <option value="Applied">Applied</option>
            <option value="Interviewing">Interviewing</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>Status</th>
              <th>Date applied</th>
              <th><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="applications-body"></tbody>
        </table>
      </div>
      <p id="empty-message" class="empty" hidden>No applications yet.</p>
      <p id="table-message" class="message table-message" role="status"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
